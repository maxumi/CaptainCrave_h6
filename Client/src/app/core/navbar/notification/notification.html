<div class="notification-shell">
	<button
		class="notification-btn"
		type="button"
		(click)="toggleNotifications()"
		[attr.aria-expanded]="isOpen"
		aria-label="Notifications"
	>
		<mat-icon class="notification-icon">notifications</mat-icon>
		@if (unreadCount > 0) {
			<span class="notification-badge">{{ unreadCount }}</span>
		}
	</button>

	@if (isOpen) {
		<div class="notification-panel" role="status" aria-live="polite">
			<div class="notification-panel-header">
				<h3>Notifications</h3>
				<button class="notification-link" type="button" (click)="clearNotifications()">
					Clear all
				</button>
			</div>

			@if (notifications.length > 0) {
				<ul class="notification-list">
					@for (notification of notifications; track $index) {
						<li class="notification-item" [class.order-update]="notification.type === 'orderStatusChanged'">
							<span class="notification-message">{{ notification.message }}</span>
							<span class="notification-meta">Order #{{ notification.orderId }}</span>
						</li>
					}
				</ul>
			} @else {
				<p class="notification-empty">No notifications yet.</p>
			}
		</div>
	}
</div>
