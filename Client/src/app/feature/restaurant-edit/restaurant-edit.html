<div class="restaurant-page">
  <main class="menu-content">
    @if (loadError()) {
      <p class="error banner">{{ loadError() }}</p>
    }

    @if (currentRestaurant(); as restaurant) {
      <nav class="restaurant-tabs" aria-label="Restaurant tabs">
        <button
          type="button"
          [class.active]="activeTab === 'restaurant'"
          (click)="activeTab = 'restaurant'"
        >
          Restaurant
        </button>

        <button
          type="button"
          [class.active]="activeTab === 'orders'"
          (click)="activeTab = 'orders'"
        >
          Orders
        </button>

        <button
          type="button"
          [class.active]="activeTab === 'menu'"
          (click)="activeTab = 'menu'"
        >
          Menu
        </button>
      </nav>

      @if (activeTab === 'restaurant') {
        <app-edit-restaurant-info
          [restaurant]="restaurant"
        />
      }

      @if (activeTab === 'orders') {
        <app-edit-order
          [restaurantId]="restaurant.id"
        />
      }

      @if (activeTab === 'menu') {
        <app-edit-menu
          [restaurantId]="restaurant.id"
        />
      }
    }
  </main>
</div>
