<div *transloco="let t">
  <h2 mat-dialog-title>{{ t('restaurantInfo.saveDialog.title') }}</h2>

  <mat-dialog-content>
    {{ t('restaurantInfo.saveDialog.message') }}
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton [mat-dialog-close]="false">
      {{ t('restaurantInfo.saveDialog.button.no') }}
    </button>

    <button matButton [mat-dialog-close]="true" cdkFocusInitial>
      {{ t('restaurantInfo.saveDialog.button.ok') }}
    </button>
  </mat-dialog-actions>
</div>
